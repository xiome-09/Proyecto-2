<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>CONTROL DE NOTAS</h1>

        <!-- Formulario de Registro -->
        <section class="card">
            <h2>1. Registrar Estudiante</h2>
            <form id="form-notas">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required placeholder="Ej. Carlos López">
                </div>

                <div class="form-group">
                    <label for="nie">NIE:</label>
                    <input type="text" id="nie" required placeholder="Ej. 12345678">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="nota1">Nota 1:</label>
                        <input type="number" id="nota1" step="0.1" min="0" max="10" required placeholder="0-10">
                    </div>
                    <div class="form-group">
                        <label for="nota2">Nota 2:</label>
                        <input type="number" id="nota2" step="0.1" min="0" max="10" required placeholder="0-10">
                    </div>
                    <div class="form-group">
                        <label for="nota3">Nota 3:</label>
                        <input type="number" id="nota3" step="0.1" min="0" max="10" required placeholder="0-10">
                    </div>
                    <div class="form-group">
                        <label for="examen">Examen:</label>
                        <input type="number" id="examen" step="0.1" min="0" max="10" required placeholder="0-10">
                    </div>
                </div>

                <button type="submit" class="btn">CALCULAR Y DESCARGAR REGISTRO</button>
            </form>

            <div id="resultado-calculo" class="resultado-box hidden"></div>
        </section>

        <!-- Consulta de Registros -->
        <section class="card">
            <h2>2. CONSULTAR NOTAS</h2>
            <div class="form-group">
                <label for="file-input">Seleccionar <code>notas.txt</code>:</label>
                <input type="file" id="file-input" accept=".txt">
            </div>
            
            <button id="btn-mostrar" class="btn btn-secondary">MOSTRAR REGISTROS</button>

            <!-- Estadísticas (Reto Adicional) -->
            <div id="stats" class="stats-box hidden">
                <p><strong>Total de estudiantes:</strong> <span id="stat-total">0</span></p>
                <p><strong>Aprobados (≥ 6.0):</strong> <span id="stat-aprobados">0</span></p>
                <p><strong>Reprobados (&lt; 6.0):</strong> <span id="stat-reprobados">0</span></p>
            </div>

            <!-- Tabla de Registros -->
            <div class="table-container">
                <table id="tabla-notas" class="hidden">
                    <thead>
                        <tr>
                            <th>NIE</th>
                            <th>Estudiante</th>
                            <th>Promedio</th>
                            <th>Resultado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
